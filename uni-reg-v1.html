<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stamford University — Registration System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0F172A;
    --navy2:   #1E293B;
    --indigo:  #6366F1;
    --indigo2: #4F46E5;
    --slate:   #64748B;
    --slate2:  #94A3B8;
    --canvas:  #F8FAFC;
    --white:   #FFFFFF;
    --card:    #FFFFFF;
    --border:  #E2E8F0;
    --red:     #EF4444;
    --green:   #10B981;
    --amber:   #F59E0B;
    --text:    #0F172A;
    --text2:   #475569;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--canvas);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ── LOGIN SCREEN ─────────────────────────────── */
  #login-screen {
    position: fixed; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
    z-index: 100;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  #login-screen.hide {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.03);
  }

  .login-box {
    background: var(--white);
    border-radius: 20px;
    padding: 48px;
    width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo2));
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(99,102,241,0.35); }
    50%       { box-shadow: 0 8px 40px rgba(99,102,241,0.6); }
  }

  .login-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .login-sub {
    text-align: center;
    font-size: 13px;
    color: var(--slate);
    margin-bottom: 32px;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--canvas);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    background: var(--white);
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo2));
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
  }

  .login-btn:hover  { opacity: 0.92; transform: translateY(-1px); }
  .login-btn:active { transform: translateY(0); }

  .login-error {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: var(--red);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .login-error.show { display: block; animation: shake 0.3s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%       { transform: translateX(-6px); }
    75%       { transform: translateX(6px); }
  }

  .login-attempts {
    text-align: center;
    font-size: 12px;
    color: var(--slate2);
    margin-top: 16px;
  }

  .hint-box {
    background: var(--canvas);
    border-radius: 10px;
    padding: 14px;
    margin-top: 24px;
    border: 1px solid var(--border);
  }

  .hint-box p {
    font-size: 11px;
    color: var(--slate);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .hint-row {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
    align-items: center;
  }

  .hint-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    min-width: 60px;
    text-align: center;
  }

  .badge-admin   { background: #EEF2FF; color: var(--indigo2); }
  .badge-advisor { background: #F0FDF4; color: #15803D; }
  .badge-student { background: #FFF7ED; color: #C2410C; }

  .hint-creds { font-size: 11px; color: var(--slate); font-family: monospace; }

  /* ── APP SHELL ────────────────────────────────── */
  #app {
    display: none;
    width: 100%;
    min-height: 100vh;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #app.show {
    display: flex;
    opacity: 1;
  }

  /* ── SIDEBAR ──────────────────────────────────── */
  #sidebar {
    width: 240px;
    min-height: 100vh;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    transform: translateX(-240px);
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 50;
  }

  #sidebar.open { transform: translateX(0); }

  .sidebar-logo {
    padding: 24px 20px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .sidebar-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .sidebar-brand { font-size: 13px; font-weight: 700; color: var(--white); line-height: 1.3; }
  .sidebar-brand span { display: block; font-size: 10px; font-weight: 400; color: var(--slate2); margin-top: 1px; }

  .sidebar-user {
    margin: 16px 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--indigo), #818CF8);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white; flex-shrink: 0;
  }

  .user-name { font-size: 13px; font-weight: 600; color: var(--white); }
  .user-role { font-size: 11px; color: var(--slate2); margin-top: 1px; }

  .sidebar-nav { flex: 1; padding: 8px 12px; overflow-y: auto; }

  .nav-section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 12px 8px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.15s;
    color: var(--slate2);
    font-size: 13px;
    font-weight: 500;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover   { background: rgba(255,255,255,0.06); color: var(--white); }
  .nav-item.active  { background: rgba(99,102,241,0.2); color: var(--white); }
  .nav-item.active .nav-icon { color: var(--indigo); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .logout-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: #F87171;
    font-size: 13px; font-weight: 500;
    border: none; background: none; width: 100%; text-align: left;
    transition: background 0.15s;
  }
  .logout-btn:hover { background: rgba(239,68,68,0.1); }

  /* ── MAIN CONTENT ─────────────────────────────── */
  #main {
    margin-left: 240px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transform: translateX(20px);
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
    opacity: 0;
  }

  #main.ready { transform: translateX(0); opacity: 1; }

  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }

  .topbar-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .topbar-sub   { font-size: 12px; color: var(--slate); margin-top: 1px; }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .role-pill {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .role-admin   { background: #EEF2FF; color: var(--indigo2); }
  .role-advisor { background: #F0FDF4; color: #15803D; }
  .role-student { background: #FFF7ED; color: #C2410C; }

  .content { padding: 28px; flex: 1; }

  /* ── WELCOME CARD ─────────────────────────────── */
  .welcome-card {
    background: linear-gradient(135deg, var(--navy), var(--navy2));
    border-radius: 16px;
    padding: 32px;
    color: var(--white);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .welcome-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    background: rgba(99,102,241,0.15);
    border-radius: 50%;
  }

  .welcome-card::after {
    content: '';
    position: absolute;
    bottom: -60px; right: 80px;
    width: 140px; height: 140px;
    background: rgba(99,102,241,0.08);
    border-radius: 50%;
  }

  .welcome-greeting { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .welcome-sub      { font-size: 14px; color: var(--slate2); max-width: 420px; }

  /* ── STATS ROW ────────────────────────────────── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stat-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }

  .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--slate); margin-top: 2px; }

  /* ── GENERIC CARD ─────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── VIEWS ────────────────────────────────────── */
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.3s ease both; }

  /* ── PLACEHOLDER ──────────────────────────────── */
  .placeholder {
    text-align: center;
    padding: 60px 20px;
    color: var(--slate);
  }
  .placeholder .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .placeholder h3    { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .placeholder p     { font-size: 13px; }

  /* ── MENU GRID ────────────────────────────────── */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .menu-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    display: flex; align-items: flex-start; gap: 14px;
  }

  .menu-card:hover {
    border-color: var(--indigo);
    box-shadow: 0 4px 20px rgba(99,102,241,0.12);
    transform: translateY(-2px);
  }

  .menu-card-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    background: #EEF2FF;
  }

  .menu-card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .menu-card-desc  { font-size: 12px; color: var(--slate); line-height: 1.4; }

</style>
</head>
<body>

<!-- ── LOGIN SCREEN ─────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🎓</div>
    <div class="login-title">Stamford University</div>
    <div class="login-sub">Registration System — Please sign in to continue</div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="off" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error">Incorrect username or password.</div>
    <div class="login-attempts" id="attempts-left"></div>

    <div class="hint-box">
      <p>Test Credentials</p>
      <div class="hint-row">
        <span class="hint-badge badge-admin">Admin</span>
        <span class="hint-creds">admin1 / admin1a</span>
      </div>
      <div class="hint-row">
        <span class="hint-badge badge-advisor">Advisor</span>
        <span class="hint-creds">advisor1 / advisor1a</span>
      </div>
      <div class="hint-row">
        <span class="hint-badge badge-student">Student</span>
        <span class="hint-creds">2408050001 / JakeLee</span>
      </div>
    </div>
  </div>
</div>

<!-- ── APP SHELL ────────────────────────────────── -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-icon">🎓</div>
      <div class="sidebar-brand">
        Stamford University
        <span>Registration System</span>
      </div>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">?</div>
      <div>
        <div class="user-name" id="user-name">—</div>
        <div class="user-role" id="user-role">—</div>
      </div>
    </div>

    <div class="sidebar-nav" id="sidebar-nav">
      <!-- populated by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="doLogout()">
        <span>🚪</span> Sign Out
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-sub" id="topbar-sub">Welcome back</div>
      </div>
      <div class="topbar-right">
        <span class="role-pill" id="role-pill">—</span>
      </div>
    </div>

    <div class="content" id="content">
      <!-- populated by JS -->
    </div>
  </div>

</div>

<script>
// ── DATA ──────────────────────────────────────────
const USERS = [
  { username: 'admin1',     password: 'admin1a',   role: 'admin',   name: 'David' },
  { username: 'advisor1',   password: 'advisor1a', role: 'advisor', name: 'Victoria' },
  { username: 'advisor2',   password: 'advisor2a', role: 'advisor', name: 'Hellen' },
  { username: '2408050001', password: 'JakeLee',   role: 'student', name: 'Jake Lee',  id: '2408050001' },
  { username: '2409110003', password: 'TinTun',    role: 'student', name: 'Tin Tun',   id: '2409110003' },
  { username: '2409240001', password: 'Khant',     role: 'student', name: 'Khant',     id: '2409240001' },
];

const MENUS = {
  admin: [
    { icon: '📚', title: 'Add Course',            desc: 'Add a new course to the curriculum', view: 'add-course' },
    { icon: '🗑️', title: 'Remove Course',         desc: 'Remove a course from the catalogue', view: 'remove-course' },
    { icon: '💺', title: 'Set Seat Limits',        desc: 'Edit seat limits for open sections', view: 'seat-limits' },
    { icon: '📂', title: 'Open Course Section',   desc: 'Open a new section for this term',   view: 'open-section' },
    { icon: '🔒', title: 'Close Course Section',  desc: 'Close a section from the schedule',  view: 'close-section' },
    { icon: '📊', title: 'System Statistics',      desc: 'View registration stats system-wide',view: 'statistics' },
  ],
  advisor: [
    { icon: '🔍', title: 'Search Student',         desc: 'Look up a student by ID',             view: 'search-student' },
    { icon: '📈', title: 'Curriculum Progress',    desc: 'View full progress for a student',     view: 'view-progress' },
    { icon: '➕', title: 'Register Course',         desc: 'Register a course on student behalf', view: 'adv-register' },
    { icon: '➖', title: 'Withdraw Course',         desc: 'Withdraw a course for a student',     view: 'adv-withdraw' },
    { icon: '⚠️', title: 'Graduation Risks',       desc: 'See which students are at risk',       view: 'graduation-risks' },
  ],
  student: [
    { icon: '✅', title: 'Completed Courses',      desc: 'View your academic record',            view: 'completed' },
    { icon: '📋', title: 'Remaining Courses',      desc: 'Check what you still need',            view: 'remaining' },
    { icon: '🔓', title: 'Check Prerequisites',    desc: 'Look up course requirements',          view: 'prerequisites' },
    { icon: '➕', title: 'Add Course',              desc: 'Register for a course this term',      view: 'register' },
    { icon: '➖', title: 'Drop Course',             desc: 'Withdraw from a registered course',    view: 'drop' },
    { icon: '🗓️', title: 'Registration Status',   desc: 'See your current registrations',        view: 'reg-status' },
  ],
};

const NAV_ITEMS = {
  admin:   [{ icon: '🏠', label: 'Dashboard', view: 'dashboard' }, { icon: '📚', label: 'Courses', view: 'dashboard' }, { icon: '📊', label: 'Statistics', view: 'dashboard' }],
  advisor: [{ icon: '🏠', label: 'Dashboard', view: 'dashboard' }, { icon: '👥', label: 'Students', view: 'dashboard' }, { icon: '⚠️', label: 'Risk Report', view: 'dashboard' }],
  student: [{ icon: '🏠', label: 'Dashboard', view: 'dashboard' }, { icon: '📋', label: 'My Courses', view: 'dashboard' }, { icon: '🗓️', label: 'Registration', view: 'dashboard' }],
};

// ── STATE ─────────────────────────────────────────
let currentUser = null;
let loginAttempts = 0;
const MAX_ATTEMPTS = 3;

// ── LOGIN ─────────────────────────────────────────
function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const user = USERS.find(x => x.username === u && x.password === p);
  const errEl  = document.getElementById('login-error');
  const attEl  = document.getElementById('attempts-left');

  if (user) {
    currentUser = user;
    loginAttempts = 0;
    document.getElementById('login-screen').classList.add('hide');
    setTimeout(launchApp, 400);
  } else {
    loginAttempts++;
    errEl.classList.add('show');
    const left = MAX_ATTEMPTS - loginAttempts;
    if (left <= 0) {
      errEl.textContent = '🔒 Account blocked. Too many failed attempts.';
      document.querySelector('.login-btn').disabled = true;
      document.querySelector('.login-btn').style.opacity = '0.4';
      attEl.textContent = '';
    } else {
      errEl.textContent = 'Incorrect username or password.';
      attEl.textContent = `${left} attempt${left > 1 ? 's' : ''} remaining`;
    }
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ── LAUNCH APP ────────────────────────────────────
function launchApp() {
  const app  = document.getElementById('app');
  const side = document.getElementById('sidebar');
  const main = document.getElementById('main');

  app.classList.add('show');
  setTimeout(() => {
    side.classList.add('open');
    setTimeout(() => main.classList.add('ready'), 150);
  }, 50);

  // Populate user info
  document.getElementById('user-name').textContent   = currentUser.name;
  document.getElementById('user-role').textContent   = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
  document.getElementById('user-avatar').textContent = currentUser.name[0].toUpperCase();
  document.getElementById('topbar-sub').textContent  = `Welcome back, ${currentUser.name}`;

  const rolePill = document.getElementById('role-pill');
  rolePill.textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
  rolePill.className   = `role-pill role-${currentUser.role}`;

  buildNav();
  showDashboard();
}

// ── BUILD NAV ─────────────────────────────────────
function buildNav() {
  const nav   = document.getElementById('sidebar-nav');
  const items = NAV_ITEMS[currentUser.role] || [];
  nav.innerHTML = `<div class="nav-section-label">Navigation</div>`;
  items.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = `nav-item${i === 0 ? ' active' : ''}`;
    btn.innerHTML = `<span class="nav-icon">${item.icon}</span>${item.label}`;
    btn.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showDashboard();
    };
    nav.appendChild(btn);
  });
}

// ── DASHBOARD ─────────────────────────────────────
function showDashboard() {
  document.getElementById('topbar-title').textContent = 'Dashboard';
  const content = document.getElementById('content');
  const role    = currentUser.role;

  const statsByRole = {
    admin:   [['📚','12','Courses Open'],['💺','284','Total Seats'],['👥','4','Registered Users'],['📊','92%','Fill Rate']],
    advisor: [['👥','4','Students'],['⚠️','1','At Risk'],['✅','3','On Track'],['📋','6','Open Sections']],
    student: [['✅','15','Completed'],['📝','0','Registered'],['🎯','64','Credits'],['📅','4','Terms Done']],
  };

  const stats   = statsByRole[role];
  const menus   = MENUS[role];
  const greet   = `Good ${getTimeOfDay()}, ${currentUser.name}!`;
  const subtext = { admin: 'Manage the curriculum, sections, and system-wide statistics.', advisor: 'Support your students — check progress, manage registrations, and review risks.', student: 'Track your academic progress and manage your course registrations.' };

  content.innerHTML = `
    <div class="welcome-card">
      <div class="welcome-greeting">${greet}</div>
      <div class="welcome-sub">${subtext[role]}</div>
    </div>
    <div class="stats-row">
      ${stats.map(([icon, val, lbl], i) => `
        <div class="stat-card" style="animation-delay:${i*0.06}s">
          <div class="stat-icon" style="background:#EEF2FF">${icon}</div>
          <div>
            <div class="stat-value">${val}</div>
            <div class="stat-label">${lbl}</div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="card-title">⚡ Quick Actions</div>
      <div class="menu-grid">
        ${menus.map(m => `
          <div class="menu-card" onclick="showPlaceholder('${m.title}')">
            <div class="menu-card-icon">${m.icon}</div>
            <div>
              <div class="menu-card-title">${m.title}</div>
              <div class="menu-card-desc">${m.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function showPlaceholder(title) {
  document.getElementById('topbar-title').textContent = title;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="placeholder">
        <div class="icon">🚧</div>
        <h3>${title}</h3>
        <p>This feature is coming in the next version — stay tuned!</p>
      </div>
    </div>
  `;
}

// ── LOGOUT ────────────────────────────────────────
function doLogout() {
  currentUser = null;
  loginAttempts = 0;
  document.getElementById('login-screen').classList.remove('hide');
  document.getElementById('app').classList.remove('show');
  document.getElementById('app').style.display = 'none';
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('main').classList.remove('ready');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('login-error').classList.remove('show');
  document.getElementById('attempts-left').textContent = '';
  document.querySelector('.login-btn').disabled = false;
  document.querySelector('.login-btn').style.opacity = '1';
  setTimeout(() => document.getElementById('app').style.display = '', 100);
}

function getTimeOfDay() {
  const h = new Date().getHours();
  return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
}
</script>
</body>
</html>
